  <style>
    @font-face {

      src: url("fonts/Monocraft.ttf") format("truetype");

      box-sizing: border-box;
      image-rendering: pixelated;

    body {

      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background-color: #171615;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }
    .container {
      background-color: #1f1f1f;
      border: 2px solid #2e2e2e;
      padding: 28px 28px 10px 28px;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    h1 {
      font-family: "Monocraft", monospace;
      font-size: 22px;
      margin-bottom: 20px;
    }
    #drop-area {
      border: 2px dashed #3c8527;
      padding: 24px;
      background-color: #141414;
      cursor: pointer;
    }
    #drop-area.highlight {
      background-color: #1b2a1b;
    }
    #drop-area input { display: none; }

      margin-top: 12px;

    button:disabled { background-color: #555; cursor: not-allowed; }

      margin-top: 16px;
      padding-top: 8px;

      width: 120px;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(16, 1fr);

    }

    .cell.gray { background: #bcbcbc; }
    .cell.green { background: #7DB554; }

<body>
  <div class="container">
    <h1 data-i18n="title">Mrpack to Zip Converter</h1>
    <div id="drop-area">
      <p data-i18n="drop-text">Drag & Drop .mrpack file</p>
      <input type="file" id="file-input" accept=".mrpack">
      <button type="button" id="select-button" data-i18n="select-button">Select File</button>
    </div>
    <div id="file-name" class="file-msg" data-i18n="no-file">No file selected</div>
    <button id="convert-button" disabled data-i18n="convert">Convert</button>
    <div class="footer">
      <div class="footer-links">
        <a href="https://modrinth.com/modpack/beautiful-optimized" target="_blank" data-i18n="pack-name">Beautiful Optimized</a>
      </div>
      <div class="footer-version">© 2026 <a href="https://modrinth.com/user/Gre2nBlade" target="_blank">Gre2nBlade</a> · <span id="version">v2.2.3</span></div>
    </div>
  </div>

  <div id="loading-modal" class="modal">
    <div class="loader">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <script>
    // Локализация
    const translations = {
      en: {
        title: "Mrpack to Zip Converter",
        "drop-text": "Drag & Drop .mrpack file",
        "select-button": "Select File",
        "no-file": "No file selected",
        convert: "Convert",
        "pack-name": "Beautiful Optimized"
      },
      ru: {
        title: "Mrpack to Zip Converter",
        "drop-text": "Перетащите .mrpack файл сюда",
        "select-button": "Выбрать файл",
        "no-file": "Файл не выбран",
        convert: "Конвертировать",
        "pack-name": "Beautiful Optimized"
      }
    };

    const lang = navigator.language.startsWith("ru") ? "ru" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });

    // Динамическая версия
    const MAJOR_VERSION = "2.3";
    fetch("build.txt")
      .then(r => r.ok ? r.text() : "3")
      .catch(() => "3")
      .then(build => {
        const buildNum = build.trim() || "3";
        document.getElementById("version").textContent = `v${MAJOR_VERSION}.${buildNum}`;
      });

    // Остальной код (с исправленной опечаткой в shuffle)
    const fileInput = document.getElementById("file-input");
    const fileName = document.getElementById("file-name");
    const selectButton = document.getElementById("select-button");
    const convertButton = document.getElementById("convert-button");
    const modal = document.getElementById("loading-modal");
    const grid = document.getElementById("grid");

    selectButton.onclick = () => fileInput.click();

    fileInput.onchange = () => {
      if (fileInput.files.length) {
        fileName.textContent = fileInput.files[0].name;
        convertButton.disabled = false;
      }
    };

    const dropArea = document.getElementById("drop-area");
    ["dragenter", "dragover", "dragleave", "drop"].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));
    ["dragenter", "dragover"].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.add("highlight")));
    ["dragleave", "drop"].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.remove("highlight")));

    dropArea.addEventListener("drop", e => {
      const file = e.dataTransfer.files[0];
      if (!file) return;
      fileInput.files = e.dataTransfer.files;
      fileName.textContent = file.name;
      convertButton.disabled = false;
    });

    const SIZE = 16;
    const cells = [];
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      grid.appendChild(cell);
      cells.push(cell);
    }

    let order = generateOrder(SIZE);

    function generateOrder(n) {
      const center = Math.floor(n / 2);
      const result = [];
      for (let r = 0; r <= center; r++) {
        const ring = [];
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (Math.max(Math.abs(x - center), Math.abs(y - center)) === r) {
              ring.push(y * n + x);
            }
          }
        }
        // Исправленная строка (была опечатка)
        for (let i = ring.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ring[i], ring[j]] = [ring[j], ring[i]];
        }
        result.push(...ring);
      }
      return result;
    }

    function setProgress(p) {
      p = Math.max(0, Math.min(1, p));
      const total = order.length;
      const grayCount = Math.floor(total * Math.min(1, p + 0.12));
      const greenCount = Math.floor(total * p);

      cells.forEach(c => c.className = "cell");
      for (let i = 0; i < grayCount; i++) cells[order[i]].classList.add("gray");
      for (let i = 0; i < greenCount; i++) cells[order[i]].classList.add("green");
    }

    async function downloadPack() {
      modal.classList.add("is-active");
      setProgress(0);
      await sleep(50);

      const zip = await JSZip.loadAsync(fileInput.files[0]);
      const manifest = JSON.parse(await zip.files["modrinth.index.json"].async("string"));

      const newZip = new JSZip();
      let loadedCount = 0;

      const startTime = performance.now();
      const minDuration = 900;

      const CONCURRENCY = 6;
      const requiredFiles = manifest.files.filter(file => file.env?.client === "required");
      const totalRequired = requiredFiles.length || 1;

      let index = 0;

      async function worker() {
        while (index < requiredFiles.length) {
          const cur = index++;
          const file = requiredFiles[cur];
          try {
            const blob = await fetch(file.downloads[0]).then(r => r.blob());
            newZip.file(file.path, blob);
            loadedCount++;
            setProgress(loadedCount / totalRequired);
            await sleep(8);
          } catch (err) {
            console.warn(`Не удалось загрузить ${file.path}`, err);
          }
        }
      }

      await Promise.all(Array(CONCURRENCY).fill().map(worker));

      const elapsed = performance.now() - startTime;
      if (elapsed < minDuration) await sleep(minDuration - elapsed);

      while (loadedCount / totalRequired < 1) {
        loadedCount = Math.min(loadedCount + 1, totalRequired);
        setProgress(loadedCount / totalRequired);
        await sleep(4);
      }

      setProgress(1);

      modal.classList.add("fade-out");
      await sleep(350);
      modal.classList.remove("is-active", "fade-out");

      const content = await newZip.generateAsync({ type: "blob" });
      saveAs(content, `${manifest.name}-${manifest.versionId}.zip`);
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    convertButton.onclick = downloadPack;
  </script>
</body>
</html>
