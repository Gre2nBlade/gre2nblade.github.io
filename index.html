<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Mrpack to Zip Converter</title>

  <!-- UI FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "Monocraft";
      src: url("fonts/Monocraft.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      image-rendering: pixelated; /* для чёткой пиксельной анимации */
    }

    /* ===== BASE ===== */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background-color: #171615;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* ===== CONTAINER ===== */
    .container {
      background-color: #1f1f1f;
      border: 2px solid #2e2e2e;
      padding: 28px 28px 10px 28px; /* уменьшен padding-bottom с 28px до 16px */
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /* ===== HEADER ===== */
    h1 {
      font-family: "Monocraft", monospace;
      font-size: 22px;
      margin-bottom: 20px;
    }

    /* ===== DROP ===== */
    #drop-area {
      border: 2px dashed #3c8527;
      padding: 24px;
      background-color: #141414;
      cursor: pointer;
    }

    #drop-area.highlight {
      background-color: #1b2a1b;
    }

    #drop-area input {
      display: none;
    }

    .file-msg {
      margin-top: 12px;
      color: #7fdc5c;
      font-size: 14px;
    }

    /* ===== BUTTON ===== */
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background-color: #3c8527;
      border: 2px solid #2e2e2e;
      color: white;
      font-size: 14px;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover {
      background-color: #52a535;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 16px; /* уменьшено с 24px → более компактно */
      padding-top: 8px; /* уменьшено с 12px */
      border-top: 1px solid #2e2e2e;
      font-size: 13px;
      color: #aaaaaa;
    }

    .footer > div:first-child {
      margin-bottom: 6px;
    }

    .footer > div:last-child {
      font-size: 12px;
      opacity: 0.8;
    }

    .footer-links a {
      color: #7fdc5c;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #b0ff9f; /* более светлый зелёный для эффекта осветления */
    }

    .footer-links {
      text-align: center;
      margin-bottom: 6px;
    }

    .footer-version {
      font-size: 12px;
      opacity: 0.8;
      text-align: center;
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.35s ease;
      opacity: 1;
    }

    .modal.fade-out {
      opacity: 0;
    }

    .modal.is-active {
      display: flex;
    }

    /* ===== НОВАЯ АНИМАЦИЯ ЗАГРУЗКИ ===== */
    .loader {
      width: 160px;
      height: 160px;
      background: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      width: 120px;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(16, 1fr);
      background: #3a3a3a;
    }

    .cell {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .cell.gray {
      background: #bcbcbc;
    }

    .cell.green {
      background: #7DB554;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      .container {
        padding: 18px 18px 12px 18px; /* уменьшен bottom-padding и на мобильных */
      }

      h1 {
        font-size: 18px;
      }

      .loader {
        width: 140px;
        height: 140px;
      }

      .grid {
        width: 100px;
        height: 100px;
      }
    }
  </style>

  <!-- Monocraft шрифт, если нужен -->
  <!-- <link rel="stylesheet" href="fonts.css"> или @font-face как раньше -->
</head>
<body>

  <div class="container">
    <h1>Mrpack to Zip Converter</h1>

    <div id="drop-area">
      <p>Drag & Drop .mrpack file</p>
      <input type="file" id="file-input" accept=".mrpack">
      <button type="button" id="select-button">Select File</button>
    </div>

    <div id="file-name" class="file-msg">No file selected</div>

    <button id="convert-button" disabled>Convert</button>

    <div class="footer">
      <div class="footer-links">
        <a href="https://modrinth.com/modpack/beautiful-optimized" target="_blank">Beautiful Optimized</a>
      </div>
      <div class="footer-version">© 2026 Gre2nBlade · v2.2.3</div>
    </div>
  </div>

  <!-- НОВЫЙ LOADER -->
  <div id="loading-modal" class="modal">
    <div class="loader">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <script>
    // ─── Элементы ────────────────────────────────────────────────
    const fileInput     = document.getElementById("file-input");
    const fileName      = document.getElementById("file-name");
    const selectButton  = document.getElementById("select-button");
    const convertButton = document.getElementById("convert-button");
    const modal         = document.getElementById("loading-modal");
    const grid          = document.getElementById("grid");

    // ─── Drop-зона (без изменений) ───────────────────────────────
    selectButton.onclick = () => fileInput.click();

    fileInput.onchange = () => {
      if (fileInput.files.length) {
        fileName.textContent = fileInput.files[0].name;
        convertButton.disabled = false;
      }
    };

    const dropArea = document.getElementById("drop-area");

    ["dragenter", "dragover", "dragleave", "drop"].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));

    ["dragenter", "dragover"].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.add("highlight")));
    ["dragleave", "drop"    ].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.remove("highlight")));

    dropArea.addEventListener("drop", e => {
      const file = e.dataTransfer.files[0];
      if (!file) return;
      fileInput.files = e.dataTransfer.files;
      fileName.textContent = file.name;
      convertButton.disabled = false;
    });

    // ─── НОВАЯ АНИМАЦИЯ ──────────────────────────────────────────
    const SIZE = 16;
    const cells = [];

    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      grid.appendChild(cell);
      cells.push(cell);
    }

    let order = generateOrder(SIZE);

    function generateOrder(n) {
      const center = Math.floor(n / 2);
      const result = [];

      for (let r = 0; r <= center; r++) {
        const ring = [];
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (Math.max(Math.abs(x - center), Math.abs(y - center)) === r) {
              ring.push(y * n + x);
            }
          }
        }
        // shuffle внутри кольца
        for (let i = ring.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ring[i], ring[j]] = [ring[j], ring[i]];
        }
        result.push(...ring);
      }
      return result;
    }

    function setProgress(p) {
      p = Math.max(0, Math.min(1, p));
      const total = order.length;

      const grayCount  = Math.floor(total * Math.min(1, p + 0.12)); // небольшой опережение серого
      const greenCount = Math.floor(total * p);

      cells.forEach(c => c.className = "cell");

      for (let i = 0; i < grayCount;  i++) cells[order[i]].classList.add("gray");
      for (let i = 0; i < greenCount; i++) cells[order[i]].classList.add("green");
    }

    // ─── КОНВЕРТАЦИЯ (только замена анимации) ────────────────────
    async function downloadPack() {
      modal.classList.add("is-active");
      setProgress(0);           // сброс в начало

      await sleep(50);

      const zip = await JSZip.loadAsync(fileInput.files[0]);
      const manifest = JSON.parse(await zip.files["modrinth.index.json"].async("string"));

      const newZip = new JSZip();
      let loadedCount = 0;

      const startTime = performance.now();
      const minDuration = 900;

      const CONCURRENCY = 6;
      const requiredFiles = manifest.files.filter(file => file.env?.client === "required");
      const totalRequired = requiredFiles.length || 1; // защита от деления на 0

      let index = 0;

      async function worker() {
        while (index < requiredFiles.length) {
          const cur = index++;
          const file = requiredFiles[cur];

          try {
            const blob = await fetch(file.downloads[0]).then(r => r.blob());
            newZip.file(file.path, blob);

            loadedCount++;
            setProgress(loadedCount / totalRequired);   // ← здесь обновляется прогресс
            await sleep(8);
          } catch (err) {
            console.warn(`Не удалось загрузить ${file.path}`, err);
          }
        }
      }

      await Promise.all(Array(CONCURRENCY).fill().map(worker));

      const elapsed = performance.now() - startTime;
      if (elapsed < minDuration) {
        await sleep(minDuration - elapsed);
      }

      // Дозаполнение до 100%, если загрузилось меньше (редко)
      while (loadedCount / totalRequired < 1) {
        loadedCount = Math.min(loadedCount + 1, totalRequired);
        setProgress(loadedCount / totalRequired);
        await sleep(4);
      }

      setProgress(1); // на всякий случай фиксируем 100%

      modal.classList.add("fade-out");
      await sleep(350);
      modal.classList.remove("is-active", "fade-out");

      const content = await newZip.generateAsync({ type: "blob" });
      saveAs(content, `${manifest.name}-${manifest.versionId}.zip`);
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    convertButton.onclick = downloadPack;
  </script>
</body>
</html>
