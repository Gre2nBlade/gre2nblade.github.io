<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы | mtools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Monocraft';
            src: url('font/Monocraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #0d100d;
            --container-bg: #161916;
            --accent-green: #38e038;
            --link-green-base: #7fdc5c;
            --link-green-hover: #a1e984;
            --text-main: #e0e0e0;
            --text-dim: #888888;
            --border-color: #2a2d2a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f4f7f4;
                --container-bg: #ffffff;
                --accent-green: #2da32d;
                --link-green-base: #7fdc5c;
                --link-green-hover: #6bc14d;
                --text-main: #1a1c1a;
                --text-dim: #666666;
                --border-color: #e0e6e0;
            }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            transition: background-color 0.3s ease;
        }

        .container {
            text-align: center;
            background-color: var(--container-bg);
            padding: 32px 28px 14px 28px;
            border-radius: 0; 
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 520px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем содержимое */
        }

        h1 {
            font-family: 'Monocraft', monospace;
            font-size: 1.8rem;
            color: var(--accent-green);
            margin-bottom: 1.5rem;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-text {
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
        }

        /* Узкая волновая загрузка */
        .loader {
            width: 180px; /* Уменьшенная ширина */
            height: 30px; /* Уменьшенная высота */
            display: flex;
            align-items: flex-end;
            gap: 4px; /* Уменьшенный зазор */
            margin-bottom: 3rem;
        }

        .bar {
            flex: 1;
            height: 10%;
            background: var(--accent-green);
            animation: wave 3.2s infinite ease-in-out;
            animation-fill-mode: both;
        }

        .bar:nth-child(1)  { animation-delay: 0s;     }
        .bar:nth-child(2)  { animation-delay: -0.32s; }
        .bar:nth-child(3)  { animation-delay: -0.64s; }
        .bar:nth-child(4)  { animation-delay: -0.96s; }
        .bar:nth-child(5)  { animation-delay: -1.28s; }
        .bar:nth-child(6)  { animation-delay: -1.60s; }
        .bar:nth-child(7)  { animation-delay: -1.92s; }
        .bar:nth-child(8)  { animation-delay: -2.24s; }
        .bar:nth-child(9)  { animation-delay: -2.56s; }
        .bar:nth-child(10) { animation-delay: -2.88s; }

        @keyframes wave {
            0%, 100% { height: 10%; }
            25% { height: 90%; }
            50% { height: 20%; }
            75% { height: 70%; }
        }

        footer {
            width: 100%;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
            gap: 8px;
        }

        footer a {
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .special-link {
            color: var(--link-green-base) !important;
        }

        .special-link:hover {
            color: var(--link-green-hover) !important;
        }

        .copyright {
            color: var(--text-dim);
        }

        .separator {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Технические работы</h1>
        
        <p class="status-text">Мы обновляем чанки и перестраиваем редстоун-схемы.<br>
           Сайт скоро вернется в строй!</p>

        <div class="loader">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <footer>
            <a href="https://modrinth.com/modpack/beautiful-optimized" target="_blank" class="special-link">Beautiful Optimized</a>
            <span class="separator">·</span>
            <span class="copyright">© 2026</span>
            <a href="https://modrinth.com/user/Gre2nBlade" target="_blank" class="special-link">Gre2nBlade</a>
            <span class="separator">·</span>
            <span>mtools</span>
        </footer>
    </div>

</body>
</html>
