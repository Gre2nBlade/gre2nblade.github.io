<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ретро Пиксельный Переключатель</title>
    <style>
        :root {
            --bg-dark: #3a3a3a;
            --border-black: #1a1e1a;
            --off-gray: #7b7b7b;
            --on-green: #448933;
            --handle-light: #d8d8d8;
            --handle-shadow: #5a5a5a;
            --accent-purple: #8b44ff;
        }

        body {
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Контейнер */
        .container {
            padding: 40px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Скрываем стандартный чекбокс */
        .pixel-switch-input {
            display: none;
        }

        /* Основной стиль переключателя */
        .pixel-switch {
            position: relative;
            width: 160px;
            height: 80px;
            background-color: var(--off-gray);
            border: 6px solid var(--border-black);
            cursor: pointer;
            image-rendering: pixelated;
            display: flex;
            align-items: center;
            /* Плавная смена цвета фона */
            transition: background-color 0.3s ease;
        }

        /* Тень внутри переключателя */
        .pixel-switch::before {
            content: '';
            position: absolute;
            top: 0px;
            left: 0px;
            right: 0px;
            bottom: 0px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        /* Иконка 'O' */
        .status-icon-off {
            position: absolute;
            right: 25px;
            width: 30px;
            height: 30px;
            border: 6px solid var(--border-black);
            box-sizing: border-box;
            /* Плавное исчезновение/появление */
            transition: opacity 0.2s ease;
            opacity: 1;
        }

        /* Иконка 'I' */
        .status-icon-on {
            position: absolute;
            left: 35px;
            width: 8px;
            height: 40px;
            background-color: white;
            /* Плавное исчезновение/появление */
            transition: opacity 0.2s ease;
            opacity: 0;
        }

        /* Ручка переключателя */
        .handle {
            position: absolute;
            left: -6px;
            top: -16px;
            width: 80px;
            height: 90px;
            background-color: var(--handle-light);
            border: 6px solid var(--border-black);
            z-index: 10;
            /* Плавное движение с эффектом инерции */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            
            /* ИСПРАВЛЕНО: Теперь обводка идет по всему периметру светлой части */
            box-shadow: 
                inset 0px -12px 0px 0px var(--handle-shadow), /* Темный низ */
                inset 0px -18px 0px 0px rgba(255, 255, 255, 0.5), /* Нижняя линия обводки НАД бортиком */
                inset 0px 0px 0px 6px rgba(255, 255, 255, 0.5); /* Обводка сверху и по бокам */
        }

        .handle::after {
            display: none;
        }

        /* Состояние ВКЛ */
        .pixel-switch-input:checked + .pixel-switch {
            background-color: var(--on-green);
        }

        .pixel-switch-input:checked + .pixel-switch .handle {
            transform: translateX(80px);
        }

        .pixel-switch-input:checked + .pixel-switch .status-icon-on {
            opacity: 1;
        }

        .pixel-switch-input:checked + .pixel-switch .status-icon-off {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <label>
                <input type="checkbox" class="pixel-switch-input">
                <div class="pixel-switch">
                    <div class="status-icon-off"></div>
                    <div class="status-icon-on"></div>
                    <div class="handle"></div>
                </div>
            </label>
        </div>
    </div>

</body>
</html>
